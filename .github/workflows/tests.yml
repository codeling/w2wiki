name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Validate composer.json
        run: composer validate --no-check-lock

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, libxml, mbstring
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Integration tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, imagick, libxml, mbstring
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration
      - name: Run SVG upload tests
        run: vendor/bin/phpunit --testsuite svg

  server:
    name: Web server rules (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: [apache, nginx]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, libxml, mbstring
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Browser/package-lock.json
      - name: Install the browser for the browser tests
        working-directory: tests/Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test the rules with ${{ matrix.server }} in Docker (and try to run scripts in a browser)
        run: W2_BROWSER=1 tests/Server/run.sh ${{ matrix.server }}
      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ matrix.server }}
          path: tests/Browser/playwright-report
          if-no-files-found: ignore

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, libxml, mbstring, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Browser/package-lock.json
      - name: Install the browser
        working-directory: tests/Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: tests/Browser
        run: npx playwright test
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: tests/Browser/playwright-report
          if-no-files-found: ignore
