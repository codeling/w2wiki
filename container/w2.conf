# Apache settings for the W2 container image (the stock php:apache image has AllowOverride None,
# so the .htaccess files which protect pages and uploads would be ignored).
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
